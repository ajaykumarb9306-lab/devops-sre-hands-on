services:

  app:
    image: nginx:alpine
    container_name: incident-app
    volumes:
      - ./app/index.html:/usr/share/nginx/html/index.html:ro

  proxy:
    image: nginx:alpine
    container_name: incident-proxy
    ports:
      - "8082:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
