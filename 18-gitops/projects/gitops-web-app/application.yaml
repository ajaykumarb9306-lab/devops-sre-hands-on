apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: gitops-web-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ajaykumarb9306-lab/devops-sre-hands-on.git
    targetRevision: main
    path: 18-gitops/projects/gitops-web-app/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
