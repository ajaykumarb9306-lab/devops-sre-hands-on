apiVersion: apps/v1
kind: Deployment

metadata:
  name: gitops-web-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: gitops-web-app

  template:
    metadata:
      labels:
        app: gitops-web-app

    spec:
      containers:
        - name: nginx
          image: nginx:alpine

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
