services:

  origin:
    image: nginx:alpine
    container_name: waf-origin
    volumes:
      - ./app/index.html:/usr/share/nginx/html/index.html:ro

  waf:
    image: nginx:alpine
    container_name: waf-proxy
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - origin
