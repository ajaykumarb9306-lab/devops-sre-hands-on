apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-with-probes

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-probes

  template:
    metadata:
      labels:
        app: nginx-probes

    spec:
      containers:
        - name: nginx
          image: nginx:alpine

          ports:
            - containerPort: 80

          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 30
            periodSeconds: 2

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10