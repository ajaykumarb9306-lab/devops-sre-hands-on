services:

  app1:
    image: nginx:alpine
    container_name: nginx-app1
    volumes:
      - ./app1/index.html:/usr/share/nginx/html/index.html:ro

  app2:
    image: nginx:alpine
    container_name: nginx-app2
    volumes:
      - ./app2/index.html:/usr/share/nginx/html/index.html:ro

  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
